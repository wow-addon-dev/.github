name: Release Blueprint

on:
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
      release-tag:
        required: false
        type: string
      build:
        required: true
        type: boolean
      full-changelog:
        required: true
        type: boolean
      cf-project-id:
        required: true
        type: string
      wago-project-id:
        required: true
        type: string
    secrets:
      CF_API_KEY:
        required: true
      WAGO_API_TOKEN:
        required: true

permissions: {}

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prework:
    name: Prework
    runs-on: ubuntu-latest
    env:
      CF_PROJECT_ID: ${{ inputs.cf-project-id }}
    outputs:
      last-release-tag: ${{ steps.tag.outputs.last_release_tag }}
      last-tag: ${{ steps.tag.outputs.last_tag }}
      new-tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout Addon Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.BOT_TOKEN }}

      - name: Checkout Central Scripts
        uses: actions/checkout@v6
        with:
          repository: wow-addon-dev/toolkit
          path: toolkit
          token: ${{ secrets.BOT_TOKEN }}

      - name: Import GPG key (Bot)
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_push_gpgsign: false

      - name: Git configuration (Bot)
        run: |
          git config user.name "${{ steps.import-gpg.outputs.name }}"
          git config user.email "${{ steps.import-gpg.outputs.email }}"

      - name: Specify old Git tags and define a new Git tag
        id: tag
        run: |
          eval "$(python3 toolkit/release/tag_define.py ${{ inputs.release-type }})"

          if [[ -n "${{ inputs.release-tag }}" ]]; then
            echo "ℹ️ Neuer Tag (manuell): ${{ inputs.release-tag }}"
            NEW_TAG="${{ inputs.release-tag }}"
          fi

          echo "last_release_tag=$LAST_RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Extend FULL-CHANGELOG.md with the current release notes
        if: inputs.full-changelog == true
        run: python3 toolkit/release/changelog_builder.py --version ${{ steps.tag.outputs.new_tag }}

      - name: Build and commit ChangelogData.lua from FULL-CHANGELOG.md
        if: inputs.full-changelog == true && github.event.repository.name != 'Library'
        run: |
          python3 toolkit/release/changelog_data_builder.py --mode release

          if git diff --quiet -- data/ChangelogData.lua; then
            echo "ℹ️ ChangelogData.lua ist bereits aktuell."
          else
            git add data/ChangelogData.lua
            git commit -m "Update in-game changelog for ${{ steps.tag.outputs.new_tag }}"
            git push origin
          fi

      - name: Set and push Git tag
        run: python3 toolkit/release/tag_push.py --tag ${{ steps.tag.outputs.new_tag }} --message "Tag ${{ steps.tag.outputs.new_tag }}"

  release:
    name: Release
    if: inputs.build
    runs-on: ubuntu-latest
    needs: prework
    env:
      CF_PROJECT_ID: ${{ inputs.cf-project-id }}
      WAGO_PROJECT_ID: ${{ inputs.wago-project-id }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Checkout Addon Repository
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prework.outputs.new-tag }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.BOT_TOKEN }}

      - name: Checkout Toolkit Repository
        uses: actions/checkout@v6
        with:
          repository: wow-addon-dev/toolkit
          path: toolkit
          token: ${{ secrets.BOT_TOKEN }}

      - name: Package
        run: >
          bash toolkit/release/packager.sh
          --version ${{ needs.prework.outputs.new-tag }}
          --last-release-version ${{ needs.prework.outputs.last-release-tag }}
