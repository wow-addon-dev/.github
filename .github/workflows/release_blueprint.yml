name: Shared Release Blueprint

on:
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
      release-tag:
        required: false
        type: string
      build:
        required: true
        type: boolean
      full-changelog:
        required: true
        type: boolean

jobs:
  prework:
    name: Prework
    runs-on: ubuntu-latest
    env:
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
    outputs:
      last-release-tag: ${{ steps.tag.outputs.last_release_tag }}
      last-tag: ${{ steps.tag.outputs.last_tag }}
      new-tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout Addon Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.BOT_TOKEN }}

      - name: Checkout Central Scripts
        uses: actions/checkout@v6
        with:
          repository: wow-addon-dev/.github
          path: shared-repo

      - name: Import GPG key (Bot)
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_push_gpgsign: false

      - name: Git configuration (Bot)
        run: |
          git config user.name "${{ steps.import-gpg.outputs.name }}"
          git config user.email "${{ steps.import-gpg.outputs.email }}"

      - name: Specify old Git tags and define a new Git tag
        id: tag
        run: |
          eval "$(python3 shared-repo/scripts/tag_define.py ${{ inputs.release-type }})"

          if [[ -n "${{ inputs.release-tag }}" ]]; then
            echo "ℹ️ Neuer Tag (manuell): ${{ inputs.release-tag }}"
            NEW_TAG="${{ inputs.release-tag }}"
          fi

          echo "last_release_tag=$LAST_RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Extend FULL-CHANGELOG.md with the current release notes
        if: inputs.full-changelog == true
        run: python3 shared-repo/scripts/changelog_builder.py --version ${{ steps.tag.outputs.new_tag }}

      - name: Get the latest version of main from the repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git reset --hard origin/main

      - name: Set and push Git tag
        run: python3 shared-repo/scripts/tag_push.py --tag ${{ steps.tag.outputs.new_tag }} --message "Tag ${{ steps.tag.outputs.new_tag }}"

  release:
    name: Release
    if: inputs.build == true
    runs-on: ubuntu-latest
    needs: prework
    env:
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Checkout Addon Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.BOT_TOKEN }}

      - name: Checkout Central Scripts
        uses: actions/checkout@v6
        with:
          repository: wow-addon-dev/.github
          path: shared-repo

      - name: Get the latest version of main from the repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git reset --hard origin/main

      - name: Package
        run: >
          bash shared-repo/scripts/packager.sh
          --version ${{ needs.prework.outputs.new-tag }}
          --last-release-version ${{ needs.prework.outputs.last-release-tag }}
