name: Bug Report
description: Report a bug to help improve this addon.
labels: ["bug"]
body:
  - type: dropdown
    id: game-version
    attributes:
      label: Game Version
      options:
        - Retail
        - Mist of Pandaria - Classic
        - Burning Crusade - Classic Anniversary Edition
        - Classic
    validations:
      required: true

  - type: input
    id: addon-version
    attributes:
      label: Addon Version
      placeholder: e.g., v2.4
    validations:
      required: true

  - type: dropdown
    id: client-language
    attributes:
      label: Client Language
      options:
        - English (enUS / enGB)
        - German (deDE)
        - French (frFR)
        - Spanish - Spain (esES)
        - Spanish - Latin America (esMX)
        - Portuguese - Brazil (ptBR)
        - Italian (itIT)
        - Russian (ruRU)
        - Korean (koKR)
        - Chinese - Simplified (zhCN)
        - Chinese - Traditional (zhTW)
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: Reproducibility
      description: How often does this bug occur?
      options:
        - Yes, always (100%)
        - Sometimes (sporadically)
        - No, only happened once so far
        - I haven't tried to reproduce it
    validations:
      required: true

  - type: dropdown
    id: conflict-test
    attributes:
      label: Conflict Test
      description: Does the issue still happen with ALL other addons disabled?
      options:
        - Yes, it still happens
        - No, it works fine without other addons
        - I haven't tested it yet
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description & Steps to Reproduce
      description: Explain the issue and how to trigger it. You can drag and drop screenshots here.
    validations:
      required: true

  - type: textarea
    id: lua-error
    attributes:
      label: Lua Error
      description: Paste any Lua errors here (from the game or BugSack).
      render: lua
    validations:
      required: false